[project]
name = "archaludon-latest-v1-rl"
version = "0.0.1"
description = "Clean-room Phase-0 residual PPO foundation anchored to exact latest-v1"
requires-python = ">=3.11"

[project.optional-dependencies]
training = ["torch>=2.11"]

[tool.setuptools]
packages = ["archaludon_rl"]
